<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Appointment Booking</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>Care Clinic</h1>
      <p>Schedule your appointment in a few simple steps.</p>
    </header>

    <form id="bookingForm" class="booking-form">
      <div class="form-group">
        <label for="patientName">Full Name</label>
        <input type="text" id="patientName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="patientEmail">Email Address</label>
        <input type="email" id="patientEmail" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="patientPhone">Phone Number</label>
        <input type="tel" id="patientPhone" placeholder="Enter phone number" required>
      </div>

      <div class="form-group">
        <label for="doctorType">Department</label>
        <select id="doctorType" required>
          <option value="" disabled selected>Select a department</option>
          <option value="General Practitioner">General Practitioner</option>
          <option value="Dentistry">Dentistry</option>
          <option value="Pediatrics">Pediatrics</option>
          <option value="Dermatology">Dermatology</option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="bookingDate">Preferred Date</label>
          <input type="date" id="bookingDate" required>
        </div>

        <div class="form-group">
          <label for="bookingTime">Preferred Time</label>
          <input type="time" id="bookingTime" required>
        </div>
      </div>

      <button type="submit" id="submitBtn">Book Appointment</button>
    </form>

    <div id="statusMessage" class="status-message"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
